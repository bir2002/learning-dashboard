<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>365 Day Learning Dashboard</title>
<style>
:root{--bg:#0e1116;--card:#171c26;--card2:#1e2532;--line:#2a3242;--txt:#e6eaf0;--dim:#8b95a7;--acc:#5b9dff;--ok:#3ecf8e;--warn:#f5a623;--bad:#ff6b6b;}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:24px;max-width:900px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex:1;min-width:120px}
.stat b{font-size:24px;display:block}.stat span{color:var(--dim);font-size:12px}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:600}
input[type=date],input[type=number]{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.day-title{font-size:18px;font-weight:600;margin:0}.day-meta{color:var(--dim);font-size:13px;margin-bottom:14px}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;transition:.15s}
.block.done{opacity:.55;background:var(--card2)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;font-size:16px;color:var(--ok);margin-top:2px}
.block.done .chk{border-color:var(--ok);background:rgba(62,207,142,.12)}
.block h3{margin:0 0 3px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);font-weight:600}
.block .topic{font-size:16px;font-weight:500}.block .theme{color:var(--dim);font-size:12px;margin-top:2px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.res a,.res button{font-size:12px;text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--card2);cursor:pointer}
.res a:hover,.res button:hover{border-color:var(--acc)}
.hour{color:var(--dim);font-size:12px;margin-left:auto;flex:none}
.foot{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.foot small{color:var(--dim)}
a.reset{color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:auto}
/* quiz modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:9}
.mask.on{display:grid}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 2px;font-size:18px}.modal .mt{color:var(--dim);font-size:13px;margin-bottom:16px}
.q{margin-bottom:16px}.q .qt{font-weight:500;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--txt);cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:rgba(62,207,142,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.13)}
.exp{font-size:13px;color:var(--dim);margin-top:6px;display:none}.exp.show{display:block}
.recall li{margin:8px 0}.recall textarea{width:100%;min-height:70px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;margin-top:6px}
.closex{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
</style></head><body>
<h1>365-Day Learning Dashboard</h1>
<div class="sub">4 hours/day &middot; 4 focus blocks &middot; 1 hour each</div>
<div class="bar">
  <div class="stat"><b id="s-done">0</b><span>blocks done</span></div>
  <div class="stat"><b id="s-days">0</b><span>days completed</span></div>
  <div class="stat"><b id="s-streak">0</b><span>day streak</span></div>
  <div class="stat"><b id="s-pct">0%</b><span>of 365 days<div class="prog"><i id="s-prog"></i></div></span></div>
</div>
<div class="nav">
  <button onclick="go(-1)">&larr; Prev</button>
  <button class="primary" onclick="goToday()">Today</button>
  <button onclick="go(1)">Next &rarr;</button>
  <span style="margin-left:8px;color:var(--dim);font-size:13px">Jump to day</span>
  <input type="number" id="jump" min="1" max="365" style="width:80px" onchange="jumpTo(this.value)"/>
  <a class="reset" onclick="hardReset()">reset progress</a>
</div>
<div id="day"></div>
<div class="foot">
  <small>Start date (Day 1):</small>
  <input type="date" id="start" onchange="setStart(this.value)"/>
  <small id="offday"></small>
</div>
<div class="mask" id="mask" onclick="if(event.target===this)closeQuiz()"><div class="modal" id="modal"></div></div>

const KEY='learn365';
let store = JSON.parse(localStorage.getItem(KEY)||'{}');
if(!store.done) store.done={};
if(!store.start) store.start=new Date().toISOString().slice(0,10);
let view=null;
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
function dayFromDate(){const s=new Date(store.start+'T00:00:00'),now=new Date();return Math.min(365,Math.max(1,Math.floor((now-s)/86400000)+1));}
function lectureUrl(topic,vid){return vid?('https://www.youtube.com/watch?v='+vid):('https://www.youtube.com/results?search_query='+encodeURIComponent(topic+' lecture tutorial'));}
function links(dn,b){
  const rec=PLAN.days[dn-1],topic=rec.t[b],vid=(rec.v&&rec.v[b])||'';
  if(!topic) return '';
  const notes='https://www.google.com/search?q='+encodeURIComponent(topic+' explained notes');
  return `<a target="_blank" rel="noopener" href="${lectureUrl(topic,vid)}">&#9654; Lecture</a>`+
         `<a target="_blank" rel="noopener" href="${notes}">&#128218; Notes</a>`+
         `<button onclick="openQuiz(${dn},${b})">&#128221; Quiz</button>`;
}
function isDayDone(dn){return [0,1,2,3].every(b=>store.done[dn+'-'+b]);}
function stats(){let blocks=Object.values(store.done).filter(Boolean).length,daysDone=0;for(let d=1;d<=365;d++)if(isDayDone(d))daysDone++;let cur=dayFromDate(),streak=0;for(let d=cur;d>=1;d--){if(isDayDone(d))streak++;else break;}return {blocks,daysDone,streak};}
function render(){
  const dn=view,rec=PLAN.days[dn-1];
  let html=PLAN.blocks.map((name,b)=>{const done=!!store.done[dn+'-'+b];
    return `<div class="block ${done?'done':''}">
      <div class="chk" onclick="toggle(${dn},${b})">${done?'✓':''}</div>
      <div><h3>${name}</h3><div class="topic">${rec.t[b]||'&mdash;'}</div>
      <div class="theme">${rec.themes[b]||''}</div><div class="res">${links(dn,b)}</div></div>
      <div class="hour">1h</div></div>`;}).join('');
  document.getElementById('day').innerHTML=`<p class="day-title">Day ${dn} &mdash; ${rec.month}</p><div class="day-meta">${dateForDay(dn)}</div>${html}`;
  const s=stats();
  s_done.textContent=s.blocks;s_days.textContent=s.daysDone;s_streak.textContent=s.streak;
  const pct=Math.round(s.daysDone/365*100);s_pct.textContent=pct+'%';document.getElementById('s-prog').style.width=pct+'%';
  document.getElementById('start').value=store.start;document.getElementById('jump').value=dn;
  const today=dayFromDate();
  document.getElementById('offday').textContent=dn===today?'(today)':(dn<today?`(${today-dn} day(s) behind)`:`(${dn-today} day(s) ahead)`);
}
const s_done=document.getElementById('s-done'),s_days=document.getElementById('s-days'),s_streak=document.getElementById('s-streak'),s_pct=document.getElementById('s-pct');
function dateForDay(dn){const s=new Date(store.start+'T00:00:00');s.setDate(s.getDate()+dn-1);return s.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});}
function toggle(dn,b){const k=dn+'-'+b;store.done[k]=!store.done[k];if(!store.done[k])delete store.done[k];save();render();}
function go(d){view=Math.min(365,Math.max(1,view+d));render();}
function goToday(){view=dayFromDate();render();}
function jumpTo(v){v=parseInt(v);if(v>=1&&v<=365){view=v;render();}}
function setStart(v){store.start=v;save();render();}
function hardReset(){if(confirm('Erase all progress?')){store={done:{},start:store.start};save();goToday();}}
/* ---- quiz modal ---- */
function openQuiz(dn,b){
  const rec=PLAN.days[dn-1],topic=rec.t[b],name=PLAN.blocks[b],bank=QUIZ[dn+'-'+b];
  let body;
  if(bank){
    body=bank.map((q,qi)=>`<div class="q"><div class="qt">${qi+1}. ${q.q}</div>`+
      q.o.map((o,oi)=>`<button class="opt" onclick="pick(this,${qi},${oi},${q.a})">${o}</button>`).join('')+
      `<div class="exp" id="exp-${qi}">${q.e}</div></div>`).join('');
  } else {
    const notes='https://www.google.com/search?q='+encodeURIComponent(topic+' explained');
    body=`<ul class="recall">
      <li>Define <b>${topic}</b> in your own words.<textarea></textarea></li>
      <li>What problem does it solve &amp; when would you use it?<textarea></textarea></li>
      <li>Give one concrete example.<textarea></textarea></li>
      <li>One common mistake / misconception?<textarea></textarea></li></ul>
      <div class="mt">Active-recall self-test. Check yourself against <a target="_blank" rel="noopener" href="${notes}">the notes &#8599;</a>, or ask Claude &ldquo;quiz day ${dn}&rdquo; for graded MCQs.</div>`;
  }
  document.getElementById('modal').innerHTML=`<span class="closex" onclick="closeQuiz()">&times;</span>
    <h2>Quiz &middot; ${topic}</h2><div class="mt">Day ${dn} &middot; ${name}</div>${body}`;
  document.getElementById('mask').classList.add('on');
}
function pick(el,qi,oi,ans){
  const opts=el.parentNode.querySelectorAll('.opt');opts.forEach(o=>o.disabled=true);
  if(oi===ans){el.classList.add('right');}else{el.classList.add('wrong');opts[ans].classList.add('right');}
  document.getElementById('exp-'+qi).classList.add('show');
}
function closeQuiz(){document.getElementById('mask').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuiz();});
view=dayFromDate();render();
